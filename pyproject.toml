[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphroute"
version = "0.1.0"
description = "Graph-based file router for RAG: narrow millions of files to hundreds before you read anything."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
rich = ["pypdf>=4", "python-docx>=1.1"]

[project.scripts]
graphroute = "graphroute.cli:main"

[tool.setuptools.packages.find]
include = ["graphroute*"]
